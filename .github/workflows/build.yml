name: build

on:
  workflow_dispatch:
  push:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1"

      - name: Espace disque
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties

      - name: Config
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            echo "storeFile=$GITHUB_WORKSPACE/neko.jks"
            echo "storePassword=123456"
            echo "keyAlias=neko"
            echo "keyPassword=123456"
            echo "apiId=35232256"
            echo "apiHash=6c9b7f5467f4d00baef445bee72538b1"
            echo "helperBotId=0"
            echo "helperBotUsername=botfather"
            echo "sentryDsn=https://dummy@o0.ingest.sentry.io/0"
            echo "mapsApiKey=AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMY"
          } > local.properties
          cat local.properties

      - name: Build
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -x :TMessagesProj_App:uploadSentryProguardMappingsRelease \
            -x :TMessagesProj_App:uploadSentryNativeSymbolsForRelease \
            -x :TMessagesProj_App:sentryBundleSourcesRelease

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: warn
